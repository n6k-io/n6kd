name: docker

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # main -> :latest, a git tag -> :<tag> verbatim, and :sha-<short> on both
      # so a running revision can always be traced back to a commit.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/srossross/n6kd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      # A fork's pull request cannot read the secret, so it builds without
      # logging in. The Dockerfile's last stage runs `n6kd selftest`, which is
      # the gate that makes an unpushed build worth running.
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
