name: docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Push is not wired up yet: registry auth (Docker Hub OIDC vs access
      # token) is still being decided. The build alone already runs the image's
      # own gate — `n6kd selftest` is the final Dockerfile stage.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: docker.io/srossross/n6kd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
