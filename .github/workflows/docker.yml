name: docker

on:
  push:
    branches: [main, "deploy/*"]
    tags: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # metadata-action would render deploy/foo as the tag "deploy-foo", so the
      # suffix is taken here instead. A second slash cannot survive into a
      # Docker tag, so deploy/a/b is rejected rather than silently mangled.
      - id: branch
        if: startsWith(github.ref, 'refs/heads/deploy/')
        run: |
          tag="${GITHUB_REF_NAME#deploy/}"
          case "$tag" in
            */*|"") echo "::error::branch $GITHUB_REF_NAME does not name a Docker tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # main -> :latest, a git tag or deploy/<tag> branch -> :<tag> verbatim,
      # and :sha-<short> on all of them so a running revision can always be
      # traced back to a commit.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/srossross/n6kd
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value=${{ steps.branch.outputs.tag }},enable=${{ steps.branch.outputs.tag != '' }}
            type=sha,prefix=sha-

      # A fork's pull request cannot read the secret, so it builds without
      # logging in. The Dockerfile's last stage runs `n6kd selftest`, which is
      # the gate that makes an unpushed build worth running.
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
