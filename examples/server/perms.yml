# Each key under catalogs is what a client ATTACHes.
catalogs:
  # Parquet files loaded into memory at boot by local.sql.
  local:
    tables:
      main.bank_failures:
        select: true
      main.titanic:
        select: true

  # The BigLake Iceberg catalog attached by iceberg.sql.
  lake:
    tables:
      reconciliation.events:
        select: true
