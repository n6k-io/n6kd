# Each key is catalog.table — the catalog part is what a client ATTACHes.
# This is the complete list: an unlisted table does not exist for clients.
expose:
  app.users: readwrite
  app.audit_log: read

# Where foo.sql's tables landed. A bare CREATE TABLE goes to memory.main,
# which is the default — shown here only for completeness.
source: memory.main

# Only needed where the bridge cannot discover the primary key itself.
keys:
  app.users: [id]
