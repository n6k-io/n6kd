# Each key names a table as the server has it: catalog.table (schema defaults to
# main) or catalog.schema.table. It is served under that same name, so a client
# reaches it as <alias>.main.users after
# ATTACH 'n6k://host' AS <alias> (TYPE n6k, CATALOG 'app').
# This is the complete list: an unlisted table does not exist for clients.
expose:
  app.main.users: readwrite
  app.main.audit_log: read

# Only needed where the bridge cannot discover the primary key itself.
keys:
  app.main.users: [id]
