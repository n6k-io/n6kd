# A client selects a catalog by its key here, and reaches its tables as
# <alias>.main.users after ATTACH 'n6k://host' AS <alias> (TYPE n6k, CATALOG 'app').
# Its value is a vcatbridge policy document, passed to
# vcatbridge_configure_policy as written. This is the complete list: an unlisted
# table does not exist for clients, and an unlisted verb is denied.
catalogs:
  app:
    tables:
      main.users:
        # Only needed where the bridge cannot discover the primary key itself.
        primary_key: [id]
        select: true
        insert: true
        update: true
        delete: true

      main.audit_log:
        select: true
