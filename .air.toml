root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/n6kd ."
  bin = "./tmp/n6kd"
  full_bin = "./tmp/n6kd --load-dotenv -f examples/foo.sql --perms examples/perms.yml --addr :8080"
  include_ext = ["go", "sql", "yml", "yaml"]
  exclude_dir = ["tmp", "scratch"]
  exclude_regex = ["_test\\.go"]
  # Long enough to coalesce a multi-file save into one rebuild.
  delay = 200
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true